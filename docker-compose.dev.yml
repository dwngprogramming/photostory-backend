name: photostory-dev-api

services:
  dev-primary-db:
    image: postgres:17.6-alpine
    container_name: dev-primary-db
    environment:
      TZ: UTC
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-primary-data:/var/lib/postgresql/data
    networks:
      - photostory-dev-network

  dev-cache:
    image: redis:7.4.3
    container_name: dev-cache
    # same auth as prod: password is read from .env.dev inside the container ($$ = no compose interpolation)
    command: sh -c 'exec redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
    env_file:
      - .env.dev
    labels:
      # Spring Boot's compose support only passes host/port for Redis (no password) and would override
      # spring.data.redis.*, so ignore this service and let application-dev.yml configure the connection
      org.springframework.boot.ignore: "true"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dev-cache-data:/data
    networks:
      - photostory-dev-network

volumes:
  dev-primary-data:
  dev-cache-data:

networks:
  photostory-dev-network:
    driver: bridge